services:
  # Backend FastAPI Service
  - type: web
    name: gymflow-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gymflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gymflow-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://gymflow-frontend.onrender.com,http://localhost:3000"
      - key: ENABLE_AI_FEATURES
        value: "true"
      - key: ENABLE_POSE_DETECTION
        value: "true"
      - key: ENABLE_WEBSOCKETS
        value: "true"
      - key: OPENAI_API_KEY
        sync: false # User will enter this manually in Render
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"

  # Frontend Next.js Service
  - type: web
    name: gymflow-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://gymflow-backend.onrender.com/api/v1"
      - key: NODE_VERSION
        value: 18.17.0

  # Redis Instance
  - type: keyvalue
    name: gymflow-redis
    plan: free
    region: oregon
    ipAllowList: [] 

# Database
databases:
  - name: gymflow-db
    plan: free
    region: oregon
    postgresMajorVersion: "15"

