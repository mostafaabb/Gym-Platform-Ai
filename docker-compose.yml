services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gymflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - gymflow_net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gymflow
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gymflow_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gymflow_net

networks:
  gymflow_net:
    driver: bridge

volumes:
  postgres_data:
